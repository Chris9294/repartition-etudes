<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Répartition des études</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- PWA meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Répartition des études">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
body { font-family: "Segoe UI", Roboto, Arial, sans-serif; padding:15px; background: linear-gradient(160deg,#f0f4ff,#fff); color:#333;}
h1 { text-align:center; font-size:36px; margin-bottom:5px; color:#1a237e; font-weight:900; letter-spacing:1px;}
#date { text-align:center; font-size:18px; color:#0d47a1; font-weight:bold; margin-bottom:20px;}
.panel { background:#fff; border-radius:14px; padding:20px; box-shadow:0 6px 20px rgba(0,0,0,0.08); margin-bottom:20px;}
input { width:70px; padding:6px; font-size:14px; }
select { padding:6px; font-size:14px; }
.class-row { display:flex; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.class-row label { width:40%; min-width:120px; margin-bottom:4px;}
.class-row input { margin-right:10px; }
.result { background:#fff; padding:20px; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,0.08);}
.study-block { padding:16px; border-radius:12px; margin-bottom:16px; color:white; font-weight:600; font-size:15px; box-shadow:0 3px 8px rgba(0,0,0,0.1); word-wrap:break-word;}
.green { background:#8bc34a; }  /* vert pastel */
.orange { background:#fb8c00; }
.red { background:#e53935; }
.blue { background:#1e88e5; }
button { padding:12px 20px; background:#1e88e5; color:white; border:none; border-radius:8px; cursor:pointer; font-size:16px; margin:5px 0; width:100%; transition:0.2s;}
button:hover { background:#1565c0; }
.school-name { text-align:center; font-size:18px; color:#0d47a1; font-weight:bold; margin-bottom:2px; }
.settings-button { position:fixed; top:14px; right:14px; z-index:20; width:44px; height:44px; padding:0; margin:0; border-radius:0; font-size:22px; background:transparent; color:#1e88e5; box-shadow:none; }
.settings-button:hover { background:transparent; color:#1565c0; }
.settings-modal { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.42); padding:18px; overflow:auto; }
.settings-modal.open { display:flex; align-items:flex-start; justify-content:center; }
.settings-dialog { width:min(560px,100%); margin:auto; background:#fff; border-radius:14px; padding:20px; box-shadow:0 12px 35px rgba(0,0,0,0.22); }
.settings-dialog h2 { margin-top:0; color:#1a237e; }
.settings-field { margin-bottom:18px; }
.settings-field label { display:block; font-weight:bold; margin-bottom:6px; }
.settings-field input[type="text"] { width:100%; box-sizing:border-box; }
.settings-class-list { margin:10px 0; }
.settings-class-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; padding:8px; background:#f5f7fb; border-radius:8px; }
.drag-handle { flex:0 0 auto; cursor:grab; user-select:none; touch-action:none; font-size:21px; line-height:1; padding:6px; color:#546e7a; }
.drag-handle:active { cursor:grabbing; }
.settings-class-row.dragging { opacity:0.45; }
.settings-class-row input { flex:1; width:auto; min-width:0; }
.settings-class-row .delete-class { width:auto; margin:0; padding:7px 10px; background:#e53935; }
.settings-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.settings-actions button { margin:0; }
.secondary-button { background:#607d8b; }
.secondary-button:hover { background:#455a64; }
.danger-button { background:#e53935; }
.danger-button:hover { background:#c62828; }
@media (min-width:500px) { .class-row label { width:180px;} button { width:auto; margin-right:10px;} }
</style>
</head>
<body>

<button class="settings-button" type="button" onclick="openSettings()" aria-label="Paramètres" title="Paramètres">⚙️</button>

<div id="schoolNameDisplay" class="school-name"></div>
<h1>Répartition des études</h1>
<div id="date"></div>

<script>
function updateDate() {
    const now = new Date();
    const options = { weekday:"long", year:"numeric", month:"long", day:"numeric" };
    const formatted = now.toLocaleDateString("fr-FR", options);
    document.getElementById("date").textContent = formatted.charAt(0).toUpperCase() + formatted.slice(1);
}
updateDate();
</script>

<div class="panel">
    <label><strong>Nombre d'études :</strong>
        <select id="studies" onchange="refreshStudySelectors()">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
        </select>
    </label>

    <p><strong>Renseignez les effectifs et choisissez si une classe doit être obligatoirement placée dans une étude.</strong></p>
    <div id="classes"></div>

    <br>
    <button onclick="compute()">Générer la répartition</button>
    <button onclick="exportPDF()">Exporter en PDF</button>
</div>

<div id="result" class="result"></div>

<div id="settingsModal" class="settings-modal" onclick="closeSettingsOnBackdrop(event)">
    <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">⚙️ Paramètres</h2>

        <div class="settings-field">
            <label for="settingsSchoolName">Nom de l'école</label>
            <input type="text" id="settingsSchoolName" placeholder="Ex. École Brossolette">
        </div>

        <div class="settings-field">
            <label>Classes</label>
            <div id="settingsClassList" class="settings-class-list"></div>
            <button type="button" class="secondary-button" onclick="addSettingsClass()">+ Ajouter une classe</button>
        </div>

        <div class="settings-actions">
            <button type="button" class="secondary-button" onclick="document.getElementById('configImportInput').click()">Importer</button>
            <button type="button" class="secondary-button" onclick="exportConfig()">Exporter</button>
            <button type="button" class="danger-button" onclick="resetConfig()">Réinitialiser</button>
        </div>

        <div class="settings-actions">
            <button type="button" onclick="saveSettings()">Enregistrer</button>
            <button type="button" class="secondary-button" onclick="closeSettings()">Annuler</button>
        </div>

        <input id="configImportInput" type="file" accept="application/json,.json" hidden onchange="importConfig(event)">
    </div>
</div>

<script>
const DEFAULT_CONFIG = {
    schoolName: "[Nom de l'école]",
    classes: [
        "CPA","CPB","CE1A","CE1B","CE1/CE2","CE2A",
        "CE2B","CM1A","CM1B","CM1/CM2","CM2A","CM2B"
    ]
};
const CONFIG_STORAGE_KEY = "repartitionEtudesConfig";

function loadConfig() {
    try {
        const stored = JSON.parse(localStorage.getItem(CONFIG_STORAGE_KEY));
        if (stored && Array.isArray(stored.classes) && stored.classes.length > 0) {
            return {
                schoolName: typeof stored.schoolName === "string" ? stored.schoolName : "",
                classes: stored.classes.filter(name => typeof name === "string" && name.trim()).map(name => name.trim())
            };
        }
    } catch (err) {
        console.warn("Configuration locale invalide, utilisation des valeurs par défaut.", err);
    }
    return { schoolName: DEFAULT_CONFIG.schoolName, classes: [...DEFAULT_CONFIG.classes] };
}

let appConfig = loadConfig();
let classNames = [...appConfig.classes];

function updateSchoolNameDisplay() {
    const el = document.getElementById("schoolNameDisplay");
    el.textContent = appConfig.schoolName;
    el.style.display = appConfig.schoolName ? "block" : "none";
}

function getCurrentClassInputs() {
    const values = {};
    classNames.forEach((name, i) => {
        const size = document.getElementById("class" + i);
        const forced = document.getElementById("force" + i);
        if (size && forced) values[name] = { size: size.value, forced: forced.value };
    });
    return values;
}

function renderClasses(previousValues = {}) {
    const classesDiv = document.getElementById("classes");
    classesDiv.innerHTML = classNames.map((name,i)=>{
        const previous = previousValues[name] || { size: "0", forced: "auto" };
        return `
        <div class="class-row">
            <label>${escapeHtml(name)}</label>
            <input type="number" id="class${i}" min="0" value="${escapeHtml(previous.size)}">
            <select id="force${i}">
                <option value="auto">Auto</option>
                <option value="1">Étude 1</option>
                <option value="2">Étude 2</option>
                <option value="3">Étude 3</option>
                <option value="4">Étude 4</option>
            </select>
        </div>`;
    }).join("");
    classNames.forEach((name, i) => {
        const previous = previousValues[name];
        if (previous) document.getElementById("force" + i).value = previous.forced;
    });
    refreshStudySelectors();
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

updateSchoolNameDisplay();
renderClasses();

function refreshStudySelectors() {
    const studyCount = parseInt(document.getElementById("studies").value);
    classNames.forEach((_, i) => {
        const select = document.getElementById("force" + i);
        [...select.options].forEach(opt=>{
            if(opt.value!=="auto" && opt.value>studyCount) opt.remove();
        });
        for(let s=1;s<=studyCount;s++){
            if(!select.querySelector(`option[value="${s}"]`)){
                select.innerHTML += `<option value="${s}">Étude ${s}</option>`;
            }
        }
    });
}

let lastStudies=[], lastTotal=0, lastMoyenne=0, lastDateText=document.getElementById("date").textContent;

function compute(){
      let classSizes=[], totalEleves=0, studyCount=parseInt(document.getElementById("studies").value);
      classNames.forEach((name,i)=>{
          const size=parseInt(document.getElementById("class"+i).value||0);
          const forced=document.getElementById("force"+i).value;
          classSizes.push({name,size,forced}); totalEleves+=size;
      });

      const order=classNames;
      const grades=name=>{ const g=[]; if(name.startsWith("CP"))g.push("CP"); if(name.includes("CE1"))g.push("CE1"); if(name.includes("CE2"))g.push("CE2"); if(name.includes("CM1"))g.push("CM1"); if(name.includes("CM2"))g.push("CM2"); return g; };
      const active=classSizes.map((c,i)=>({...c,index:i})).filter(c=>c.size>0);
      const forcedMasks=Array(studyCount).fill(0), free=[];
      active.forEach(c=>{ if(c.forced!=="auto"){ const s=parseInt(c.forced)-1; if(s>=0&&s<studyCount) forcedMasks[s]|=1<<c.index; } else free.push(c); });

      // Optimisation globale par programmation dynamique.
      // Priorité 1 : éviter les doublons entre classes à niveau simple.
      // Priorité 2 : conserver des effectifs proches (tolérance d'environ 1 à 2 élèves).
      // Priorité 3 : répartir les grands et les trois groupes d'autonomie.
      const n=free.length, N=1<<n, fullN=1<<classNames.length;
      const expand=new Array(N).fill(0);
      for(let m=1;m<N;m++){ const b=m&-m, j=Math.log2(b), prev=m^b; expand[m]=expand[prev]|(1<<free[j].index); }
      const totals=new Array(fullN).fill(0), dup=new Array(fullN).fill(0);
      const gradeCounts=Array.from({length:fullN},()=>[0,0,0,0,0]);
      const autonomyCounts=Array.from({length:fullN},()=>[0,0,0]);
      const cmCounts=new Array(fullN).fill(0);
      const gb={CP:0,CE1:1,CE2:2,CM1:3,CM2:4};
      const gradesByClass=classNames.map(grades);
      const groupTotals=[0,0,0]; let cmTotal=0;
      active.forEach(c=>{
          const levels=gradesByClass[c.index];
          const group=levels.length ? gb[levels[0]]===0 ? 0 : gb[levels[0]]<=2 ? 1 : 2 : 1;
          groupTotals[group]++;
          if(levels.length===1 && gb[levels[0]]>=3) cmTotal++;
      });
      for(let m=1;m<fullN;m++){
          const b=m&-m, i=Math.log2(b), prev=m^b, levels=gradesByClass[i];
          totals[m]=totals[prev]+classSizes[i].size;
          gradeCounts[m]=gradeCounts[prev].slice();
          autonomyCounts[m]=autonomyCounts[prev].slice();
          cmCounts[m]=cmCounts[prev];
          if(classSizes[i].size>0){
              if(levels.length===1){
                  const level=gb[levels[0]];
                  gradeCounts[m][level]++;
                  if(level>=3)cmCounts[m]++;
              }
              const group=levels.length ? gb[levels[0]]===0 ? 0 : gb[levels[0]]<=2 ? 1 : 2 : 1;
              autonomyCounts[m][group]++;
          }
          dup[m]=gradeCounts[m].reduce((sum,c)=>sum+Math.max(0,c-1),0);
      }
      const moyenneCible=totalEleves/studyCount;
      const educationalCost=mask=>{
          const cmGap=cmCounts[mask]*studyCount-cmTotal;
          return 8*cmGap*cmGap+autonomyCounts[mask].reduce((sum,count,g)=>{
              const gap=count*studyCount-groupTotals[g];
              return sum+2*gap*gap;
          },0);
      };
      const excessCost=mask=>Math.pow(Math.max(0,Math.abs(totals[mask]-moyenneCible)-1.25),2);
      const better=(a,b)=>!b||a.d<b.d||(a.d===b.d&&(a.e<b.e||(a.e===b.e&&(a.p<b.p||(a.p===b.p&&a.q<b.q)))));
      let dp=new Array(N).fill(null); dp[0]={d:0,e:0,p:0,q:0}; const parents=[];
      for(let s=0;s<studyCount;s++){
          const next=new Array(N).fill(null), parent=new Array(N).fill(null);
          for(let assigned=0;assigned<N;assigned++) if(dp[assigned]){
              const remaining=(N-1)^assigned;
              for(let sub=remaining;;sub=(sub-1)&remaining){
                  const mask=forcedMasks[s]|expand[sub], dest=assigned|sub;
                  const cand={d:dp[assigned].d+dup[mask],e:dp[assigned].e+excessCost(mask),p:dp[assigned].p+educationalCost(mask),q:dp[assigned].q+totals[mask]*totals[mask]};
                  if(better(cand,next[dest])){next[dest]=cand;parent[dest]={prev:assigned,sub};}
                  if(sub===0)break;
              }
          }
          dp=next; parents.push(parent);
      }
      const chosen=Array(studyCount).fill(0); let cur=N-1;
      for(let s=studyCount-1;s>=0;s--){const p=parents[s][cur]; chosen[s]=p?p.sub:0; cur=p?p.prev:0;}

      let studies=Array.from({length:studyCount},()=>({total:0,classes:[]}));
      for(let s=0;s<studyCount;s++) active.forEach(c=>{if(c.forced!=="auto"&&parseInt(c.forced)-1===s){studies[s].total+=c.size;studies[s].classes.push({name:c.name,size:c.size});}});
      for(let s=0;s<studyCount;s++) for(let j=0;j<n;j++) if(chosen[s]&(1<<j)){const c=free[j];studies[s].total+=c.size;studies[s].classes.push({name:c.name,size:c.size});}

      const moyenne=totalEleves/studyCount;
      lastStudies=studies; lastTotal=totalEleves; lastMoyenne=moyenne; lastDateText=document.getElementById("date").textContent;
      let html=`<h3>Total élèves : <strong>${totalEleves}</strong></h3>`;
      html+=`<h3>Moyenne : <strong>${moyenne.toFixed(1)}</strong> élèves par étude</h3><br>`;
      html+=`<h3><u>Répartition proposée :</u></h3>`;
      studies.filter(study=>study.total>0).forEach((study,i)=>{
          let colorClass="green"; const diff=study.total-moyenne; if(diff>12)colorClass="red"; else if(diff>5)colorClass="orange";
          const sortedClasses=study.classes.sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name)).map(c=>`${c.name} (${c.size})`);
          html+=`<div class="study-block ${colorClass}">Étude ${i+1} — <strong>${study.total}</strong> élèves<br>${sortedClasses.join(", ")}</div>`;
      });
      document.getElementById("result").innerHTML=html;
  }

  function exportPDF(){
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    let y=15;

    doc.setFontSize(18);
    doc.text("Répartition des études",10,y); y+=10;

    if (appConfig.schoolName) {
        doc.setFontSize(13);
        doc.setFont("helvetica","bold");
        doc.text(appConfig.schoolName,10,y); y+=8;
    }

    doc.setFontSize(12);
    doc.setFont("helvetica","bold");
    doc.text(`Date : ${lastDateText}`,10,y); y+=7;

    doc.setFont("helvetica","normal");
    doc.text(`Total élèves : ${lastTotal}`,10,y); y+=7;
    doc.text(`Moyenne par étude : ${lastMoyenne.toFixed(1)}`,10,y); y+=10;

    const order = classNames;

    lastStudies.filter(study=>study.total>0).forEach((study,i)=>{
        doc.setFontSize(14); doc.text(`Étude ${i+1} — ${study.total} élèves`,10,y); y+=7;
        doc.setFontSize(11);
        const sortedClasses = study.classes.sort((a,b)=> order.indexOf(a.name) - order.indexOf(b.name));
        sortedClasses.forEach(cl=>{
            doc.text("• "+cl.name+` (${cl.size})`,14,y); y+=6;
            if(y>280){ doc.addPage(); y=15; }
        });
        y+=4;
    });

    doc.save("repartition_etudes.pdf");
}



function openSettings() {
    document.getElementById("settingsSchoolName").value = appConfig.schoolName;
    renderSettingsClassList(classNames);
    document.getElementById("settingsModal").classList.add("open");
}

function closeSettings() {
    document.getElementById("settingsModal").classList.remove("open");
    document.getElementById("configImportInput").value = "";
}

function closeSettingsOnBackdrop(event) {
    if (event.target.id === "settingsModal") closeSettings();
}

function renderSettingsClassList(names) {
    const list = document.getElementById("settingsClassList");
    list.innerHTML = "";
    names.forEach(name => list.appendChild(createSettingsClassRow(name)));
}

function createSettingsClassRow(name = "") {
    const row = document.createElement("div");
    row.className = "settings-class-row";
    row.innerHTML = `
        <span class="drag-handle" title="Déplacer" aria-label="Déplacer">☰</span>
        <input type="text" class="settings-class-name" value="${escapeHtml(name)}" aria-label="Nom de la classe">
        <button type="button" class="delete-class" aria-label="Supprimer la classe">✕</button>`;

    row.querySelector(".delete-class").addEventListener("click", () => row.remove());
    attachDragHandlers(row);
    return row;
}

function addSettingsClass() {
    const list = document.getElementById("settingsClassList");
    const row = createSettingsClassRow("");
    list.appendChild(row);
    row.querySelector("input").focus();
}

let draggedSettingsRow = null;
let pointerDraggedRow = null;
let pointerId = null;

function attachDragHandlers(row) {
    const handle = row.querySelector(".drag-handle");
    handle.draggable = true;
    handle.addEventListener("dragstart", event => {
        draggedSettingsRow = row;
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
    });
    handle.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        draggedSettingsRow = null;
    });
    row.addEventListener("dragover", event => {
        event.preventDefault();
        if (!draggedSettingsRow || draggedSettingsRow === row) return;
        const rect = row.getBoundingClientRect();
        const before = event.clientY < rect.top + rect.height / 2;
        row.parentNode.insertBefore(draggedSettingsRow, before ? row : row.nextSibling);
    });

    handle.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse") return;
        pointerDraggedRow = row;
        pointerId = event.pointerId;
        row.classList.add("dragging");
        handle.setPointerCapture(pointerId);
        event.preventDefault();
    });
    handle.addEventListener("pointermove", event => {
        if (!pointerDraggedRow || event.pointerId !== pointerId) return;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".settings-class-row");
        if (!target || target === pointerDraggedRow || target.parentNode !== pointerDraggedRow.parentNode) return;
        const rect = target.getBoundingClientRect();
        const before = event.clientY < rect.top + rect.height / 2;
        target.parentNode.insertBefore(pointerDraggedRow, before ? target : target.nextSibling);
        event.preventDefault();
    });
    const stopPointerDrag = event => {
        if (!pointerDraggedRow || event.pointerId !== pointerId) return;
        pointerDraggedRow.classList.remove("dragging");
        pointerDraggedRow = null;
        pointerId = null;
    };
    handle.addEventListener("pointerup", stopPointerDrag);
    handle.addEventListener("pointercancel", stopPointerDrag);
}

function getSettingsConfig() {
    const schoolName = document.getElementById("settingsSchoolName").value.trim();
    const classes = [...document.querySelectorAll(".settings-class-name")].map(input => input.value.trim()).filter(Boolean);
    if (classes.length === 0) throw new Error("Ajoutez au moins une classe.");
    if (new Set(classes).size !== classes.length) throw new Error("Deux classes ne peuvent pas avoir le même nom.");
    return { schoolName, classes };
}

function applyConfig(config) {
    const previousValues = getCurrentClassInputs();
    appConfig = { schoolName: config.schoolName || "", classes: [...config.classes] };
    classNames = [...appConfig.classes];
    localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(appConfig));
    updateSchoolNameDisplay();
    renderClasses(previousValues);
    document.getElementById("result").innerHTML = "";
}

function saveSettings() {
    try {
        applyConfig(getSettingsConfig());
        closeSettings();
    } catch (err) {
        alert(err.message);
    }
}

function resetConfig() {
    if (!confirm("Réinitialiser le nom de l'école et les classes avec la configuration par défaut ?")) return;
    document.getElementById("settingsSchoolName").value = DEFAULT_CONFIG.schoolName;
    renderSettingsClassList(DEFAULT_CONFIG.classes);
}

function exportConfig() {
    let config;
    try {
        config = getSettingsConfig();
    } catch (err) {
        alert(err.message);
        return;
    }
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "configuration-etudes.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
}

function importConfig(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const imported = JSON.parse(reader.result);
            if (!imported || !Array.isArray(imported.classes)) throw new Error();
            const classes = imported.classes.map(name => typeof name === "string" ? name.trim() : "").filter(Boolean);
            if (classes.length === 0 || new Set(classes).size !== classes.length) throw new Error();
            document.getElementById("settingsSchoolName").value = typeof imported.schoolName === "string" ? imported.schoolName : "";
            renderSettingsClassList(classes);
        } catch (err) {
            alert("Le fichier de configuration est invalide.");
        } finally {
            event.target.value = "";
        }
    };
    reader.readAsText(file);
}

// Enregistrement service worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("Service Worker enregistré !"))
    .catch(err => console.error("Erreur Service Worker :", err));
}
</script>

</body>
</html>
